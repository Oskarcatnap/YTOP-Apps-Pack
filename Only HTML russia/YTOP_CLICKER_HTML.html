<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YTOP - You Try Open Popcorn</title>
    <style>
        body {
            background: #1a1a1a;
            color: #ffcc00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #game-ui { padding: 20px; }
        #popcorn-btn {
            font-size: 120px;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.1s;
            filter: drop-shadow(0 0 15px #ffcc00);
            margin: 20px;
        }
        #popcorn-btn:active { transform: scale(0.8); }
        .stat { font-size: 24px; margin: 10px; font-weight: bold; }
        .shop {
            background: #222;
            padding: 20px;
            border-top: 4px solid #ffcc00;
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled { background: #555; cursor: not-allowed; }
        .floating-pop {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            animation: moveUp 1s ease-out forwards;
        }
        @keyframes moveUp {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(-200px) rotate(360deg); opacity: 0; }
        }
        /* Стиль для "Идиот-мода" */
        .idiot-body { background: white !important; color: black !important; }
    </style>
</head>
<body onload="checkStatus()">

    <div id="ui">
        <h1>🍿 PROJECT YTOP 🍿</h1>
        <p><i>You Try Open Popcorn</i></p>

        <div id="popcorn-btn" onclick="pop(event)">🌽</div>

        <div class="stat">Собрано попкорна: <span id="score">0</span></div>
        <div class="stat">Давление: <span id="pps">0</span> пак/сек</div>

        <div class="shop">
            <button id="buy1" onclick="buy(1, 15)">🔥 Спичка (Цена: 15)</button>
            <button id="buy2" onclick="buy(10, 100)">🧨 Динамит (Цена: 100)</button>
            <button id="buy3" onclick="buy(50, 500)">🚀 Реактор (Цена: 500)</button>
        </div>
    </div>

    <script>
        let count = 0;
        let pps = 0;

        function pop(e) {
            count++;
            createFloatingPop(e.clientX, e.clientY);
            update();
        }

        function createFloatingPop(x, y) {
            let el = document.createElement("div");
            el.className = "floating-pop";
            el.innerText = "🍿";
            el.style.left = x + "px";
            el.style.top = y + "px";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function buy(power, cost) {
            if (count >= cost) {
                count -= cost;
                pps += power;
                update();
            }
        }

        function update() {
            document.getElementById('score').innerText = Math.floor(count);
            document.getElementById('pps').innerText = pps;
            document.getElementById('buy1').disabled = count < 15;
            document.getElementById('buy2').disabled = count < 100;
            document.getElementById('buy3').disabled = count < 500;

            // ФИНАЛЬНЫЙ ВЗРЫВ на 1000 попкорна
            if (count >= 1000) {
                triggerExplosion();
            }
        }

        setInterval(() => {
            if (pps > 0) {
                count += pps;
                update();
            }
        }, 1000);

        function triggerExplosion() {
            alert("КРИТИЧЕСКОЕ ДАВЛЕНИЕ! ПОПКОРН ВЗРЫВАЕТСЯ!");
            // Открываем "вирусное" окно (самого себя с хэшем)
            window.open(window.location.href + "#boom", "_blank", "width=400,height=300");
        }

        function checkStatus() {
            if (window.location.hash === "#boom") {
                document.body.className = "idiot-body";
                document.body.innerHTML = "<h1 style='font-size:100px;'>☺</h1><h1>YOU ARE AN IDIOT!</h1><p>YTOP: TOO MUCH POPCORN!</p>";
                
                let x = Math.random() * 500, y = Math.random() * 400;
                let dx = 15, dy = 15;
                setInterval(() => {
                    x += dx; y += dy;
                    if (x > screen.width - 400 || x < 0) dx *= -1;
                    if (y > screen.height - 300 || y < 0) dy *= -1;
                    window.moveTo(x, y);
                }, 30);
            }
        }
    </script>
</body>
</html>
